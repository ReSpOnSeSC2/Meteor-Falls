<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a18" />
    <title>METEOR FALLS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a18;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #rotate-hint {
        position: fixed;
        inset: 0;
        background: #0a0a18;
        color: #f8f8f0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: monospace;
        font-size: 18px;
        z-index: 100;
        padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">&#x1F4F1;&#x21BB;<br /><br />Turn your phone sideways!<br />METEOR FALLS plays in landscape.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
